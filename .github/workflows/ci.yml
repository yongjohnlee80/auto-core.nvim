name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the tree.
permissions:
  contents: read

# A superseded run proves nothing about the head that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# auto-core is the foundation every sibling plugin depends on, and until now it
# had NO automated gate at all — every suite ran only where someone happened to
# run it. A regression here reaches auto-agents, auto-finder, worktree,
# md-harpoon and autodb before anyone notices locally.
#
# This job runs `tests/run-all.sh`, which already knows how to turn a silent
# abort into a loud failure (it parses the `<P> passed, <F> failed` summary and
# treats its ABSENCE as a hard failure). CI does not reimplement that logic; it
# supplies the environment and lets the runner be the judge.
jobs:
  lua:
    runs-on: ubuntu-latest
    # The pty suite has an OPEN, un-root-caused deadlock todo
    # (2026-08-24-auto-core-pty-suite-…): nvim can block at startup on a
    # hit-enter prompt when the runner's pty does not answer the DSR probe, and
    # it is INVOCATION-dependent — it deadlocks through run-all.sh, the
    # invocation this job uses. The per-test watchdog bounds each test; this
    # bounds the job, so the failure mode is a red run rather than a hung one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the suite inspects this repository through
          # auto-core.git.*, so a shallow clone hides refs it reads.
          fetch-depth: 0

      # actions/checkout leaves a DETACHED HEAD with no local branches.
      #
      # Read this carefully before changing it, because the obvious fix is
      # wrong. `git branch --force main origin/main` ALONE makes the two
      # branch assertions pass for the wrong reason: default_branch() runs
      # `git symbolic-ref --short HEAD`, which FAILS on a detached HEAD and
      # returns its literal fallback string "main" — so creating a branch of
      # that name reduces `local_branch_exists(default_branch(root))` to "the
      # workflow created a branch called main". A test of the workflow, by the
      # workflow.
      #
      # Attaching HEAD is what makes them pass for the same reason they pass on
      # a developer machine: default_branch() then returns a real symbolic ref.
      # The tested commit does not move — `checkout -B` only names it.
      - name: attach HEAD and provide the default branch
        run: |
          # ATTACH FIRST, THEN CREATE. The order is load-bearing, not stylistic.
          # On a PUSH event actions/checkout does NOT detach — it checks the
          # branch out — so creating it while it is the current branch fails
          # with "cannot force update the branch 'main' used by worktree", and
          # the || fallback fails for the same reason ("refusing to fetch into
          # branch ... checked out"). Under bash -e that kills the step before
          # the checkout that would have made the update legal ever runs.
          # Measured on a real clone in both shapes: this order exits 0 on
          # both; the reverse exits 128 on push.
          git checkout -B ci-head
          git branch --force "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH" \
            || git fetch --no-tags origin \
                 "+refs/heads/$DEFAULT_BRANCH:refs/heads/$DEFAULT_BRANCH"
          echo "branches:"; git branch --list
          echo "HEAD: $(git symbolic-ref --short HEAD)"
        env:
          # Survives a default-branch rename, unlike a hardcoded "main".
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: install neovim
        env:
          # Pinned by VERSION AND CHECKSUM. A GitHub release asset can be
          # replaced under the same tag and name, so the version alone is not
          # reproducible; the SHA-256 is the real pin. v0.12.5 is the version
          # these suites were verified against locally. Recompute when bumping.
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          # --retry: a transient network blip should not fail a PR for reasons
          # unrelated to its change.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: install plenary.nvim
        env:
          # Hard dependency per ADR-0006 §"Resolutions" #3; tests/smoke.lua
          # ASSERTS its presence rather than skipping, so a missing plenary is a
          # red suite and not a quiet gap. Pinned for the same reproducibility
          # reason as neovim above.
          PLENARY_SHA: "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: |
          dest="$HOME/.local/share/nvim/lazy/plenary.nvim"
          mkdir -p "$(dirname "$dest")"
          git clone --filter=blob:none https://github.com/nvim-lua/plenary.nvim "$dest"
          git -C "$dest" checkout "$PLENARY_SHA"

      # Named "assert", not "verify", because it CAN fail: it compares the
      # running nvim against the pin. A step named "verify" that only prints a
      # version and checks a directory exists is the present-and-blind shape —
      # it converts "nobody checked" into "checked and fine".
      - name: assert the toolchain matches the pin
        env:
          NVIM_VERSION: "v0.12.5"
        run: |
          got="$(nvim --version | head -1 | awk '{print $2}')"
          echo "nvim: $got (pinned $NVIM_VERSION)"
          test "$got" = "$NVIM_VERSION"
          test -d "$HOME/.local/share/nvim/lazy/plenary.nvim"

      # The pty suite is deliberately NOT skipped. It asserts behaviour Neovim
      # only exhibits with a UI attached — WinScrolled never fires headlessly,
      # so a headless assertion on that path passes while testing nothing.
      # `script` (util-linux) is present on ubuntu-latest, so CI runs the one
      # gate a headless developer environment cannot.
      - name: tests/run-all.sh (smoke + standalones + pty + bench)
        run: ./tests/run-all.sh

      # The pty runner writes its transcript to tests/ui/.<name>.log. Locally
      # you open that file; in CI the runner is gone and cannot be reproduced,
      # so without this the gate's LIKELIEST failure — the open pty deadlock
      # todo above — would arrive with no evidence attached.
      - name: pty transcript on failure
        if: failure()
        run: tail -40 tests/ui/.*.log || true
